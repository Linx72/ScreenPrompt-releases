<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Страница не найдена · ScreenPrompt</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #0c0d10; color: #f3f5f8; }
      main { width: min(680px, calc(100% - 40px)); border: 1px solid #5a606b; padding: 40px; box-shadow: 8px 8px 0 rgba(155,225,93,.14); }
      span { color: #9be15d; font: 12px ui-monospace, monospace; }
      h1 { margin: 18px 0; font-size: clamp(48px, 9vw, 92px); line-height: .9; letter-spacing: -.07em; }
      p { color: #a8afbb; }
      a { display: inline-block; margin-top: 18px; padding: 13px 18px; background: #9be15d; color: #0c0d10; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #f3f5f8; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span>HTTP 404 · NO EVIDENCE FOUND</span>
      <h1>Этой страницы нет.</h1>
      <p>Вернитесь к ScreenPrompt — там контекст собран и следующий шаг понятен.</p>
      <a href="/">На главную</a>
    </main>
  </body>
</html>
